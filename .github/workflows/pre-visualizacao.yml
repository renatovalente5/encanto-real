# A loja Encanto Real em https://encantoreal.pt (GitHub Pages; o domínio está na Hostinger, com os A/AAAA do Pages e o
# www em CNAME para renatovalente5.github.io). O endereço antigo renatovalente5.github.io/encanto-real/ reencaminha.
#
# Ainda é a PRÉ-VISUALIZAÇÃO (content/site.json → "preVisualizacao": true): noindex em todas as páginas, sem
# pagamentos ligados (o «Pagar» abre uma janela de pré-visualização), a conta fica só no browser e os dados legais por
# escrever aparecem como «[por confirmar: …]». As três propostas da página inicial ficam em /propostas/a/, /b/ e /c/.
# Quando houver pagamentos e backoffice, o site passa para a Cloudflare.
name: Pré-visualização

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pre-visualizacao
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # o histórico todo: as datas do mapa do site saem do git (numa clonagem rasa saíam todas iguais)
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Instalar o three.js e o opentype.js
        run: npm ci --no-audit --no-fund
      - name: Construir a pré-visualização
        run: node src/build.mjs --site=https://encantoreal.pt
      - name: Conferir o que sai
        run: |
          set -euo pipefail
          test -f _site/index.html || { echo "FALTA _site/index.html"; exit 1; }
          test -f _site/404.html   || { echo "FALTA _site/404.html"; exit 1; }
          grep -q 'name="robots" content="noindex' _site/index.html || { echo "a pré-visualização tem de ser noindex"; exit 1; }
          grep -q 'data-base=""' _site/index.html || { echo "no domínio a base tem de ser vazia"; exit 1; }
          grep -q '<link rel="canonical" href="https://encantoreal.pt/">' _site/index.html || { echo "o canónico tem de ser https://encantoreal.pt/"; exit 1; }
          if grep -rl 'renatovalente5.github.io' _site --include='*.html' --include='*.xml' --include='*.txt' | head -1 | grep -q .; then echo "ainda há páginas com o endereço antigo"; exit 1; fi
          for p in loja loja/arco-triplo-real finalizar conta/entrar monta propostas/b; do test -f "_site/$p/index.html" || { echo "FALTA $p"; exit 1; }; done
          echo "ok: $(find _site -type f | wc -l | tr -d ' ') ficheiros"
      - name: Provar o SEO (pré-visualização e loja aberta)
        run: |
          set -euo pipefail
          node scripts/testar.mjs _site
          node src/build.mjs --site=https://encantoreal.pt --ensaio-aberta --saida=.cache/aberta
          node scripts/testar.mjs .cache/aberta --aberta
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./_site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
